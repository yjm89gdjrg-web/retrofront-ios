name: Build iOS IPA
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      signed:
        description: '使用仓库 Secrets 导出已签名 IPA'
        type: boolean
        default: false
      bundle_id:
        description: 'Bundle ID（签名时必须匹配描述文件）'
        type: string
        default: 'com.example.retrofront'
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      BUNDLE_ID: ${{ inputs.bundle_id || 'com.example.retrofront' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install, test, bundle
        run: |
          npm ci
          npm test
          npm run build
          node scripts/project.mjs
          node scripts/icon.mjs
      - name: Validate bundle identifier
        run: |
          [[ "$BUNDLE_ID" =~ ^[a-zA-Z0-9-]+(\.[a-zA-Z0-9-]+)+$ ]] || exit 1
          xcodebuild -version
          plutil -lint ios/RetroFront/Info.plist ios/RetroFront/PrivacyInfo.xcprivacy ios/RetroFront.xcodeproj/project.pbxproj
      - name: Build simulator for Swift and resource validation
        run: |
          xcodebuild -project ios/RetroFront.xcodeproj -scheme RetroFront -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO build
      - name: Archive unsigned device app
        if: ${{ !inputs.signed }}
        run: |
          xcodebuild -project ios/RetroFront.xcodeproj -scheme RetroFront -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/RetroFront.xcarchive \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO archive
          mkdir -p build/unsigned/Payload
          cp -R build/RetroFront.xcarchive/Products/Applications/RetroFront.app build/unsigned/Payload/
          cd build/unsigned
          /usr/bin/zip -qry ../RetroFront-unsigned.ipa Payload
      - name: Archive and export signed device app
        if: ${{ inputs.signed && github.event_name == 'workflow_dispatch' }}
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: bash scripts/sign-ios.sh
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RetroFront-iOS-${{ github.run_number }}
          path: build/**/*.ipa
          if-no-files-found: error
          retention-days: 14
